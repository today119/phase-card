<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B4F82">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="행사 진행 카드">
<link rel="manifest" href="manifest.json">

<title>행사 진행 카드</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#F1F5FA;color:#0F172A;-webkit-text-size-adjust:100%;padding-bottom:140px}
button{font-family:inherit;cursor:pointer;color:inherit}
input,textarea,select{font-family:inherit}
.hd{position:sticky;top:0;z-index:5;background:#0B4F82;color:#fff;padding:12px 16px 10px;padding-top:max(12px,env(safe-area-inset-top))}
.hrow{display:flex;align-items:center;gap:8px}
.hrow h1{flex:1;font-size:19px;font-weight:900;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{border:0;background:rgba(255,255,255,.18);color:#fff;font-size:14px;font-weight:800;padding:7px 11px;border-radius:999px;white-space:nowrap}
.sub{font-size:13px;opacity:.85;margin-top:2px}
.seg{display:flex;gap:4px;background:rgba(255,255,255,.15);border-radius:12px;padding:4px;margin-top:10px;overflow-x:auto}
.seg button{flex:1 0 auto;border:0;background:none;color:#fff;font-size:14px;font-weight:800;padding:9px 10px;border-radius:9px;white-space:nowrap}
.seg button.on{background:#fff;color:#0B4F82}
.seg button.add{flex:0 0 auto;opacity:.8}
.bar{height:6px;background:rgba(255,255,255,.25);border-radius:3px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:#FCD34D;width:0;transition:width .3s}
.list{padding:12px 16px}
.card{background:#fff;border-radius:18px;margin-bottom:14px;box-shadow:0 2px 0 #E2E8F0;overflow:hidden;border:2px solid transparent}
.card.now{border-color:#F59E0B}
.card.done{opacity:.55}
.ch{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.num{flex:none;width:34px;height:34px;border-radius:50%;background:#0B4F82;color:#fff;font-weight:900;display:grid;place-items:center;font-size:16px}
.card.done .num{background:#94A3B8}
.ct{flex:1;min-width:0}
.ct b{display:block;font-size:17px;font-weight:900;line-height:1.25}
.ct small{font-size:13px;color:#64748B;font-weight:700}
.pen{flex:none;border:0;background:#F1F5F9;border-radius:10px;width:36px;height:36px;font-size:16px}
.body{padding:0 16px 14px}
.todo{list-style:none}
.todo li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid #F1F5F9;font-size:15px;line-height:1.4}
.todo li .bx{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid #CBD5E1;display:grid;place-items:center;font-size:15px;color:#fff;margin-top:1px}
.todo li.ok .bx{background:#16A34A;border-color:#16A34A}
.todo li.ok .tx{color:#94A3B8;text-decoration:line-through}
.tg{font-size:11px;font-weight:900;padding:2px 6px;border-radius:6px;margin-right:4px;vertical-align:1px;background:#E2E8F0;color:#334155}
.img{display:block;width:100%;border-radius:12px;margin:10px 0 0}
.msg{background:#F8FAFC;border:1px dashed #CBD5E1;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.5;white-space:pre-wrap;margin-top:10px;color:#334155;word-break:break-all}
.btns{display:flex;gap:8px;margin-top:8px}
.btns button{flex:1;border:0;border-radius:12px;padding:12px 6px;font-size:15px;font-weight:900}
.btns .sm{flex:0 0 52px}
.share{background:#FEE500;color:#191919}
.copy{background:#E2E8F0;color:#0F172A}
.fin{background:#0B4F82;color:#fff}
.card.done .fin{background:#94A3B8}
.del{background:#FEE2E2;color:#B91C1C}
.ins{display:block;width:100%;margin:-4px 0 14px;border:2px dashed #F59E0B;background:#FFFBEB;color:#B45309;border-radius:14px;padding:10px;font-size:14px;font-weight:900}
.mini{display:flex;gap:8px;margin-top:10px}
.mini button{flex:1;border:1px dashed #94A3B8;background:none;color:#475569;border-radius:12px;padding:9px 4px;font-size:13px;font-weight:800}
.ed{margin-top:10px}
.ed label{display:block;font-size:12px;font-weight:900;color:#64748B;margin:10px 0 4px}
.ed input,.ed textarea,.ed select{width:100%;border:2px solid #93C5FD;border-radius:12px;padding:10px 12px;font-size:16px;line-height:1.5;background:#fff;color:#0F172A}
.ed .hint{font-size:12px;color:#94A3B8;margin-top:4px}
.ed .imgrow{display:flex;gap:8px;align-items:center;margin-top:8px}
.ed .imgrow img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.ed .imgrow label{margin:0;flex:1;border:1px dashed #94A3B8;border-radius:12px;padding:10px;text-align:center;color:#475569;font-size:14px;font-weight:800}
.ed .imgrow button{border:0;background:#FEE2E2;color:#B91C1C;border-radius:10px;padding:10px;font-weight:800}
.fab{position:fixed;left:16px;right:16px;bottom:max(16px,env(safe-area-inset-bottom));z-index:6;border:0;background:#F59E0B;color:#fff;font-size:18px;font-weight:900;padding:16px;border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.empty{text-align:center;color:#64748B;padding:40px 20px;font-size:15px;line-height:1.7}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#0F172A;color:#fff;font-size:14px;font-weight:800;padding:10px 16px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;white-space:nowrap}
.toast.on{opacity:.92}
.sheet{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:20;display:flex;align-items:flex-end}
.sheet .box{background:#fff;width:100%;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 16px max(20px,env(safe-area-inset-bottom))}
.sheet h2{font-size:19px;font-weight:900;margin-bottom:6px}
.sheet p{font-size:13px;color:#64748B;line-height:1.5}
.opt{display:block;width:100%;text-align:left;border:2px solid #E2E8F0;background:#fff;border-radius:14px;padding:12px 14px;margin-top:8px;font-size:15px;font-weight:800}
.opt.on{border-color:#0B4F82;background:#EFF6FF}
.opt small{display:block;font-size:12px;color:#64748B;font-weight:600;margin-top:2px}
.evl{display:flex;gap:8px;align-items:center;border:2px solid #E2E8F0;border-radius:14px;padding:10px 12px;margin-top:8px}
.evl.on{border-color:#0B4F82;background:#EFF6FF}
.evl b{flex:1;font-size:15px}
.evl button{border:0;background:#F1F5F9;border-radius:10px;padding:8px 10px;font-weight:800;font-size:13px}
.foot{text-align:center;font-size:12px;color:#94A3B8;padding:6px 16px;line-height:1.8}
</style>
</head><body>
<div class="hd" id="hd"></div>
<div class="list" id="list"></div>
<div class="foot" id="foot"></div>
<button class="fab" id="fab" hidden>＋ 맨 끝에 일정 추가</button>

/* ── 사진(IndexedDB) ── */
var idb = null;
function db(cb) {
  if (idb) return cb(idb);
  try {
    var r = indexedDB.open('pc_img', 1);
    r.onupgradeneeded = function () { r.result.createObjectStore('img'); };
    r.onsuccess = function () { idb = r.result; cb(idb); };
    r.onerror = function () { cb(null); };
  } catch (e) { cb(null); }
}
function putImg(id, blob, cb) { db(function (d) { if (!d) return cb(false); var t = d.transaction('img', 'readwrite'); t.objectStore('img').put(blob, id); t.oncomplete = function () { cb(true); }; t.onerror = function () { cb(false); }; }); }
function getImg(id, cb) { db(function (d) { if (!d) return cb(null); var q = d.transaction('img').objectStore('img').get(id); q.onsuccess = function () { cb(q.result || null); }; q.onerror = function () { cb(null); }; }); }
function delImg(id) { db(function (d) { if (d) d.transaction('img', 'readwrite').objectStore('img').delete(id); }); if (IMGS[id]) { URL.revokeObjectURL(IMGS[id]); delete IMGS[id]; } }
function shrink(file, cb) {   // 긴 변 1280px JPEG 로 줄여 저장(카톡 전송도 빨라진다)
  var u = URL.createObjectURL(file), im = new Image();
  im.onload = function () {
    var s = Math.min(1, 1280 / Math.max(im.width, im.height)), c = document.createElement('canvas');
    c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
    c.toBlob(function (b) { cb(b || file); }, 'image/jpeg', 0.85);
  };
  im.onerror = function () { URL.revokeObjectURL(u); cb(file); };
  im.src = u;
}
function fillImgs() {
  document.querySelectorAll('img[data-img]').forEach(function (im) {
    var id = im.dataset.img;
    if (IMGS[id]) { im.src = IMGS[id]; return; }
    getImg(id, function (b) { if (b) { IMGS[id] = URL.createObjectURL(b); im.src = IMGS[id]; } else im.remove(); });
  });
}

  var json = JSON.stringify(packEvent(e));
  var done = function (code) {
    var url = location.origin + location.pathname + '#e=' + code;
    var text = '[행사 진행 카드] «' + e.name + '»\n아래 링크를 열면 선생님 폰에 이 행사가 복사돼요 👇\n' + url;
    if (navigator.share) navigator.share({text: text}).catch(function () {});
    else copyText(text, '링크를 복사했어요');
  };
  if (window.CompressionStream) {
    new Response(new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer().then(function (b) { done('z' + b64u(b)); }, function () { done('j' + b64u(new TextEncoder().encode(json))); });
  } else done('j' + b64u(new TextEncoder().encode(json)));
}
function addPacked(o) {
  var e = {id: uid(), name: o.n, days: o.d.map(function (d) { return {id: uid(), label: d[0], phases: d[1].map(function (q) { return {id: uid(), t: q[0], p: q[1], todo: q[2] || [], msgs: (q[3] || []).map(function (t) { return {text: t}; }), ck: [], done: ''}; })}; })};
  e.day = e.days[0].id;
  D.events.unshift(e); D.cur = e.id; save(); ED = null; render(); toast('«' + e.name + '» 행사를 받았어요');
}
function readLink() {
  /* #f=이름 → ev/이름.json (계획서로 미리 만들어 둔 행사 — 링크가 짧다) */
  var f = location.hash.match(/^#f=([\w-]+)/);
  if (f) {
    history.replaceState(null, '', location.pathname);
    fetch('ev/' + f[1] + '.json', {cache: 'no-store'}).then(function (r) { return r.json(); }).then(function (o) {
      if (D.events.some(function (e) { return e.name === o.n; }) && !confirm('«' + o.n + '» 행사가 이미 있어요. 하나 더 받을까요?')) return;
      addPacked(o);
    }).catch(function () { toast('행사를 받지 못했어요 — 인터넷을 확인해 주세요'); });
    return;
  }
  var m = location.hash.match(/^#e=([zj])([\w-]+)/);
  if (!m) return;
  history.replaceState(null, '', location.pathname);
  var bytes = unb64u(m[2]);
  var p = m[1] === 'z' && window.DecompressionStream
    ? new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text()
    : Promise.resolve(new TextDecoder().decode(bytes));
  p.then(function (txt) { addPacked(JSON.parse(txt)); }).catch(function () { toast('링크를 읽지 못했어요'); });
}

/* ── 보내기·복사 ── */
function copyText(t, msg) {
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t).then(function () { toast(msg || '복사했어요 — 카톡에 붙여 넣으세요'); }, function () { oldCopy(t, msg); });
  oldCopy(t, msg);
}
function oldCopy(t, msg) {
  var a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select();
  try { document.execCommand('copy'); toast(msg || '복사했어요'); } catch (e) { toast('복사가 안 돼요 — 길게 눌러 복사해 주세요'); }
  a.remove();
}
function share(m) {
  if (!navigator.share) { copyText(m.text); return; }
  // 카톡은 그림+글을 같이 받으면 글을 버리기도 해서 글은 클립보드에도 넣어 둔다
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(m.text).catch(function () {});
  if (!m.img) { navigator.share({text: m.text}).catch(function () {}); return; }
  getImg(m.img, function (b) {
    if (!b) { navigator.share({text: m.text}).catch(function () {}); return; }
    var d = {files: [new File([b], '사진.jpg', {type: 'image/jpeg'})], text: m.text};
    if (navigator.canShare && !navigator.canShare(d)) d = {text: m.text};
    navigator.share(d).then(function () { if (d.files) toast('글이 빠졌으면 카톡 입력창에 붙여 넣기 하세요'); }).catch(function () {});
  });
}

/* ── 누르기 ── */
function P(id) { var d = dayOf(ev()); for (var i = 0; i < d.phases.length; i++) if (d.phases[i].id === id) return {L: d.phases, i: i, x: d.phases[i]}; }
var pendingImg = null;    // 편집 중 고른 사진 {blob, url}
document.addEventListener('change', function (e) {
  if (e.target.id !== 'e_img' || !e.target.files[0]) return;
  shrink(e.target.files[0], function (b) {
    pendingImg = {blob: b};
    var row = e.target.closest('.imgrow'), im = row.querySelector('img');
    if (!im) { im = document.createElement('img'); row.insertBefore(im, row.firstChild); }
    im.removeAttribute('data-img'); im.src = URL.createObjectURL(b);
    toast('사진을 골랐어요 — 저장을 눌러 주세요');
  });
});
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-a],[data-day],#menuB,#fab');
  var li = e.target.closest('li[data-j]');
  if (li && !ED) {
    var F0 = P(li.dataset.id), j = +li.dataset.j, ck = F0.x.ck || (F0.x.ck = []), q = ck.indexOf(j);
    if (q >= 0) ck.splice(q, 1); else ck.push(j);
    save(); render(); return;
  }
  if (!b) return;
  if (b.id === 'menuB') return menuSheet();
  if (b.id === 'fab') {
    var d0 = dayOf(ev()), np = {id: uid(), t: '', p: '', todo: [], msgs: [], ck: [], done: ''};
    d0.phases.push(np); ED = {pid: np.id, m: 'p', focus: true, fresh: true}; save(); render();
    var c = $('c' + np.id); if (c) window.scrollTo({top: c.offsetTop - 140, behavior: 'smooth'});
    return;
  }
  if (b.dataset.day) {
    var E = ev();
    if (b.dataset.day === '+') { var n = prompt('새 탭 이름', (E.days.length + 1) + '일차'); if (!n) return; var nd = {id: uid(), label: n.trim(), phases: []}; E.days.push(nd); E.day = nd.id; }
    else E.day = b.dataset.day;
    ED = null; save(); render(); window.scrollTo(0, 0); return;
  }
  var a = b.dataset.a, id = b.dataset.id, k = b.dataset.k, F = id ? P(id) : null;
  if (a === 'newev') return newEventSheet();
  if (a === 'open') { D.cur = id; save(); return render(); }
  if (a === 'share') return share(F.x.msgs[+k]);
  if (a === 'copy') return copyText(F.x.msgs[+k].text);
  if (a === 'cancel') {
    if (ED && ED.fresh) { var G = P(ED.pid); if (G && !G.x.p && !G.x.msgs.length) G.L.splice(G.i, 1); save(); }
    ED = null; pendingImg = null; return render();
  }
  if (a === 'medit') { ED = {pid: id, m: +k, focus: true}; pendingImg = null; return render(); }
  if (a === 'mnew') { ED = {pid: id, m: 'new', focus: true}; pendingImg = null; return render(); }
  if (a === 'pedit') { ED = {pid: id, m: 'p', focus: true}; return render(); }
  if (a === 'pnew') { var nq = {id: uid(), t: '', p: '', todo: [], msgs: [], ck: [], done: ''}; F.L.splice(F.i + 1, 0, nq); ED = {pid: nq.id, m: 'p', focus: true, fresh: true}; save(); return render(); }
  if (a === 'msave') {
    var txt = $('e_msg').value.replace(/\s+$/, '');
    var m = k === 'new' ? {text: ''} : F.x.msgs[+k];
    if (!txt && !pendingImg && !m.img) { ED = null; return render(); }
    m.text = txt;
    var fin = function () { if (k === 'new') F.x.msgs.push(m); ED = null; pendingImg = null; save(); toast(k === 'new' ? '메시지를 추가했어요' : '저장했어요'); render(); };
    if (pendingImg) { var iid = 'i' + uid(); if (m.img) delImg(m.img); putImg(iid, pendingImg.blob, function (ok) { if (ok) m.img = iid; else toast('사진 저장이 안 됐어요'); fin(); }); }
    else fin();
    return;
  }
  if (a === 'imgdel') { var mm = F.x.msgs[+k]; if (mm && mm.img) { delImg(mm.img); delete mm.img; save(); } pendingImg = null; return render(); }
  if (a === 'mdel') { if (!confirm('이 메시지를 지울까요?')) return; var dm = F.x.msgs.splice(+k, 1)[0]; if (dm && dm.img) delImg(dm.img); ED = null; save(); return render(); }
  if (a === 'psave') {
    F.x.t = $('e_t').value.trim(); F.x.p = $('e_p').value.trim() || '새 일정';
    F.x.todo = $('e_todo').value.split('\n').map(function (l) { return l.trim(); }).filter(Boolean).map(function (l) {
      var mt = l.match(/^([^:：]{1,10})[:：]\s*(.+)$/); return mt ? [mt[1].trim(), mt[2]] : ['', l];
    });
    F.x.ck = [];
    var wasFresh = ED.fresh;
    ED = wasFresh && !F.x.msgs.length ? {pid: F.x.id, m: 'new', focus: true} : null;   // 새 일정이면 바로 메시지 쓰기로
    save(); toast('저장했어요'); return render();
  }
  if (a === 'up' || a === 'down') {
    var to = F.i + (a === 'up' ? -1 : 1); if (to < 0 || to >= F.L.length) return;
    F.L.splice(to, 0, F.L.splice(F.i, 1)[0]); save(); return render();
  }
  if (a === 'pdel') { if (!confirm('«' + (F.x.p || '새 일정') + '» 일정을 지울까요?')) return; F.x.msgs.forEach(function (q) { if (q.img) delImg(q.img); }); F.L.splice(F.i, 1); ED = null; save(); return render(); }
  if (a === 'fin') {
    if (F.x.done) F.x.done = '';
    else { var t = new Date(); F.x.done = ('0' + t.getHours()).slice(-2) + ':' + ('0' + t.getMinutes()).slice(-2); }
    save(); render();
    if (F.x.done) { var n2 = document.querySelector('.card.now'); if (n2) window.scrollTo({top: n2.offsetTop - 140, behavior: 'smooth'}); }
  }
});
window.addEventListener('hashchange', readLink);
readLink();
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
